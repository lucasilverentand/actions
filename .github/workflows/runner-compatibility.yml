name: Runner compatibility
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'JSON runner selector: a hosted label, label array, or object with group and labels'
        required: true
        type: string
        default: '"ubuntu-latest"'
permissions:
  contents: read
concurrency:
  group: runner-compatibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compatibility:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run check
      - run: git diff --exit-code -- ':(glob)*/dist/**'
      - uses: ./ci-gate
        with:
          # Exercise the runner-supplied Node action runtime after the suite passed.
          needs: '{"compatibility-suite":{"result":"success"}}'
