name: PR policy
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: pr-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pr-policy:
    name: PR policy
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: seventwo-studio/actions/pr-policy@e7df504d6d30f8531f166183a7721cb71dc732d6 # reviewed implementation
