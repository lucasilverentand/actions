name: PR policy
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: pr-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pr-policy:
    name: PR policy
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: seventwo-studio/actions/pr-policy@72174c448681225675445238096b5633d30f172e # reviewed implementation
