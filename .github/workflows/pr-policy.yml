name: PR policy
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: pr-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pr-policy:
    # The job name is a required check on main; keep it when changing the implementation.
    name: PR policy
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The organization's shared PR message check, run directly on a GitHub-hosted runner
      # because this public repository accepts fork PRs. Pinned to a default-branch commit.
      - uses: seventwo-studio/.github/.github/actions/pr-message@5b98f97872b2a6ac3f563a60a228a88e8a2bcd38
        with:
          token: ${{ github.token }}
