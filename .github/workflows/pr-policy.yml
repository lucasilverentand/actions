name: PR policy
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: pr-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pr-policy:
    name: PR policy
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Retired after v1.4.x; this pin is the last release containing the action.
      - uses: seventwo-studio/actions/pr-policy@517b07c39cd92a88e01a636f9fc372207b586fba # v1.4.0
