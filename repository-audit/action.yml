name: Repository audit
description: Read-only checks for repository settings and unsafe workflow configuration.
author: Luca Silverentand
inputs:
  token:
    description: Repository-scoped token. Administrative checks require Administration read access.
    required: true
    default: ${{ github.token }}
  fail-on-error:
    description: Fail the job when an error or an unverified inspection is found.
    default: 'true'
  required-checks:
    description: JSON array of exact CI check names that must be required on the default branch.
    default: '[]'
  rules:
    description: JSON object mapping rule ids to error, warning or off. Unverified inspections cannot be changed.
    default: '{}'
  trusted-owners:
    description: JSON array of owners whose actions and reusable workflows may be referenced by branch or tag.
    default: '[]'
outputs:
  findings:
    description: JSON array of findings. Keep this output in the consuming repository.
  passed:
    description: JSON boolean indicating whether all error-level checks pass.
runs:
  using: node24
  main: dist/index.mjs
