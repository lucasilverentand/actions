name: Merged branch cleanup
description: Preview or delete old branches whose exact current tip belongs to a merged PR.
author: Luca Silverentand
inputs:
  token:
    description: Repository-scoped token with Contents write and Pull requests read for deletion.
    required: true
    default: ${{ github.token }}
  dry-run:
    description: Set false explicitly to delete eligible branches.
    default: 'true'
  minimum-age-days:
    description: Minimum age of both the merge and the tip commit (7–3650 days).
    default: '30'
  max-deletions:
    description: Abort if the total number of candidates exceeds this limit (1–100).
    default: '10'
  keep-prefixes:
    description: JSON array of additional branch prefixes to retain. Built-in exclusions always apply.
    default: '[]'
outputs:
  candidates:
    description: JSON array of branch names and expected SHAs.
  deleted-count:
    description: Number of branches deleted.
runs:
  using: node24
  main: ../dist/branch-cleanup.mjs
