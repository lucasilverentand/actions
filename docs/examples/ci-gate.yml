name: Required CI
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  # Replace this demonstration job with the repository's real suite jobs.
  tests:
    # PR-triggered: keep GitHub-hosted for repositories that accept fork PRs. See docs/runner-compatibility.md.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: node -e "console.log('Replace this example with the real test command')"
  required:
    name: CI required
    needs: [tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: seventwo-studio/actions/ci-gate@8e01e3ca1e33bca460a292150fe504b2c6b4f13e # v2.1.1
        with:
          needs: ${{ toJSON(needs) }}
          required-jobs: '["tests"]'
