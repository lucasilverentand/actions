name: Required CI
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  # Replace this demonstration job with the repository's real suite jobs.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: node -e "console.log('Replace this example with the real test command')"
  required:
    name: CI required
    needs: [tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: seventwo-studio/actions/ci-gate@5b412e499e68b1a093e631c06767602f00ccb804
        with:
          needs: ${{ toJSON(needs) }}
          required-jobs: '["tests"]'
