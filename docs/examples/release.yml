name: Semantic release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: semantic-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # Adapt these commands to the repository's verification contract.
      - run: npm ci --ignore-scripts
      - run: npm test
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: seventwo-studio/actions/release@5b412e499e68b1a093e631c06767602f00ccb804
        with:
          # After reviewing the plan, set false and grant this job contents: write.
          dry-run: 'true'
          needs: ${{ toJSON(needs) }}
