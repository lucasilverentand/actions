name: Private fleet audit
on:
  schedule:
    - cron: '37 2 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: private-fleet-audit
  cancel-in-progress: false
jobs:
  audit:
    # Unset AUTOMATION_RUNNER uses GitHub-hosted Ubuntu; set it to a JSON runner selector for your own runners.
    runs-on: ${{ fromJSON(vars.AUTOMATION_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: seventwo-studio/actions/fleet-audit@8e01e3ca1e33bca460a292150fe504b2c6b4f13e # v2.1.1
        id: audit
        with:
          token: ${{ secrets.FLEET_AUDIT_TOKEN }}
          organization: example-org
          fail-on-error: 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # reviewed implementation
        if: always() && steps.audit.outputs.report-path != ''
        with:
          name: private-fleet-audit
          path: ${{ steps.audit.outputs.report-path }}
          retention-days: 7
          if-no-files-found: error
