name: Private fleet audit
on:
  schedule:
    - cron: '37 2 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: private-fleet-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: seventwo-studio/actions/fleet-audit@da44bb149829f39aca3eae174453924916a6f126 # validated implementation
        id: audit
        with:
          token: ${{ secrets.FLEET_AUDIT_TOKEN }}
          organization: example-org
          fail-on-error: 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # reviewed implementation
        if: always() && steps.audit.outputs.report-path != ''
        with:
          name: private-fleet-audit
          path: ${{ steps.audit.outputs.report-path }}
          retention-days: 7
          if-no-files-found: error
