name: Repository audit
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: seventwo-studio/actions/repository-audit@f3ec22312a6a9a9c0ae95b317400503359f2d2ee # reviewed implementation
        with:
          # Store a repository-scoped, read-only audit credential in this repo.
          token: ${{ secrets.REPOSITORY_AUDIT_TOKEN }}
