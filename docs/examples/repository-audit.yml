name: Repository audit
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: seventwo-studio/actions/repository-audit@f89330b3f65110c5a9e9c4cb2297d1b6668eecd8 # reviewed implementation
        with:
          # Store a repository-scoped, read-only audit credential in this repo.
          token: ${{ secrets.REPOSITORY_AUDIT_TOKEN }}
