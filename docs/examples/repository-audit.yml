name: Repository audit
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: seventwo-studio/actions/repository-audit@72174c448681225675445238096b5633d30f172e # reviewed implementation
        with:
          # Store a repository-scoped, read-only audit credential in this repo.
          token: ${{ secrets.REPOSITORY_AUDIT_TOKEN }}
