name: Repository audit
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: seventwo-studio/actions/repository-audit@da44bb149829f39aca3eae174453924916a6f126 # reviewed implementation
        with:
          # Store a repository-scoped, read-only audit credential in this repo.
          token: ${{ secrets.REPOSITORY_AUDIT_TOKEN }}
