name: Repository audit
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: seventwo-studio/actions/repository-audit@e7df504d6d30f8531f166183a7721cb71dc732d6 # reviewed implementation
        with:
          # Store a repository-scoped, read-only audit credential in this repo.
          token: ${{ secrets.REPOSITORY_AUDIT_TOKEN }}
