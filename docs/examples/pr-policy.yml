name: PR policy
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions: {}
jobs:
  pr-policy:
    # PR-triggered: keep GitHub-hosted for repositories that accept fork PRs. See docs/runner-compatibility.md.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: seventwo-studio/actions/pr-policy@e7df504d6d30f8531f166183a7721cb71dc732d6 # reviewed implementation
