name: PR policy
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions: {}
jobs:
  pr-policy:
    # PR-triggered: keep GitHub-hosted for repositories that accept fork PRs. See docs/runner-compatibility.md.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: seventwo-studio/actions/pr-policy@517b07c39cd92a88e01a636f9fc372207b586fba # v1.4.0
