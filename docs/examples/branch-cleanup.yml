name: Branch cleanup
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: branch-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    # Unset AUTOMATION_RUNNER uses GitHub-hosted Ubuntu; set it to a JSON runner selector for your own runners.
    runs-on: ${{ fromJSON(vars.AUTOMATION_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: seventwo-studio/actions/branch-cleanup@517b07c39cd92a88e01a636f9fc372207b586fba # v1.4.0
        with:
          # After reviewing previews, set false and grant contents: write above.
          dry-run: 'true'
          minimum-age-days: '30'
          max-deletions: '10'
