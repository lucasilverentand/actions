name: Workflow policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow-policy:
    # PR-triggered: keep GitHub-hosted for repositories that accept fork PRs. See docs/runner-compatibility.md.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: seventwo-studio/actions/workflow-policy@8e01e3ca1e33bca460a292150fe504b2c6b4f13e # v2.1.1
