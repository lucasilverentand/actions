name: Commit policy
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  commit-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Replace with the reviewed implementation SHA after publication.
      - uses: seventwo-studio/actions/commit-policy@72174c448681225675445238096b5633d30f172e
        with:
          allow-scopes: 'false'
