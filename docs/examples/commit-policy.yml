name: Commit policy
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  commit-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Replace with the reviewed implementation SHA after publication.
      - uses: seventwo-studio/actions/commit-policy@5b412e499e68b1a093e631c06767602f00ccb804
        with:
          allow-scopes: 'false'
