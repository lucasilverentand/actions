name: Commit policy
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  commit-policy:
    # Unset AUTOMATION_RUNNER uses GitHub-hosted Ubuntu; set it to a JSON runner selector for your own runners.
    runs-on: ${{ fromJSON(vars.AUTOMATION_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: seventwo-studio/actions/commit-policy@517b07c39cd92a88e01a636f9fc372207b586fba # v1.4.0
        with:
          allow-scopes: 'false'
